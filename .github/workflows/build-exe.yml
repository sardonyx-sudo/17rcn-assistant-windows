name: Windows EXE 雲端自動打包

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 打包 Windows 桌面版 EXE
    runs-on: windows-latest

    steps:
      - name: 下載原始碼
        uses: actions/checkout@v7

      - name: 設定 Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安裝相依套件與 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 執行 PyInstaller 打包
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "ui;ui" --name "RotaryAssistant" main.py

      - name: 壓縮打包產物為 ZIP
        run: |
          Compress-Archive -Path dist/RotaryAssistant -DestinationPath RotaryAssistant-Windows-x64.zip

      - name: 上傳 EXE 壓縮包供直接下載
        uses: actions/upload-artifact@v7
        with:
          name: 扶輪公益網助手-Windows桌面版
          path: RotaryAssistant-Windows-x64.zip
          retention-days: 30
